# Access logs intentionally omit query strings, cookies, client IPs and request bodies.
log_format drivecare escape=json '{"time":"$time_iso8601","requestId":"$sent_http_x_request_id","method":"$request_method","status":$status,"durationSeconds":$request_time,"upstreamStatus":"$upstream_status"}';

map $upstream_http_x_request_id $correlation_id {
    default $upstream_http_x_request_id;
    "" $request_id;
}

upstream drivecare_backend {
    zone drivecare_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
    keepalive 64;
    keepalive_timeout 30s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log drivecare;
    add_header X-Request-ID $correlation_id always;

    # A single proxy policy for APIs and API documentation.
    location ~ ^/(api(?:/|$)|v3/api-docs(?:/|$)|swagger-ui(?:/|$)|swagger-ui\.html$) {
        proxy_pass http://drivecare_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
