# VS Code/Gradle on Windows -> the project's Docker databases.
# Windows may already run a separate MariaDB on port 3306.
spring.datasource.url=jdbc:mariadb://127.0.0.1:13306/drivecare
spring.datasource.username=${DB_USERNAME:drivecare}
spring.datasource.password=${DB_PASSWORD:drivecare-local}
spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379
spring.data.redis.password=${REDIS_PASSWORD:drivecare-redis-local}
app.frontend-origin=http://localhost:5173
