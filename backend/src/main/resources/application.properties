spring.application.name=drivecare
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/drivecare}
spring.datasource.username=${DB_USERNAME:drivecare}
spring.datasource.password=${DB_PASSWORD:drivecare}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
spring.session.data.redis.namespace=drivecare:session
spring.session.data.redis.flush-mode=on-save

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=DRIVECARE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [requestId:%X{requestId:-} jobId:%X{jobId:-}]
logging.level.com.portfolio.drivecare=${APP_LOG_LEVEL:INFO}
# Hibernate exception messages can contain duplicate values from user input.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.mariadb.jdbc.message.server.ErrorPacket=OFF
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.logging.slow-request-ms=${SLOW_REQUEST_MS:1000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}
app.notifications.cron=${NOTIFICATION_CRON:0 0 9 * * *}
app.time-zone=${APP_TIME_ZONE:Asia/Seoul}
app.notifications.zone=${app.time-zone}
app.notifications.batch-size=${NOTIFICATION_BATCH_SIZE:100}
